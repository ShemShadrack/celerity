name: CI

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:

jobs:
  clippy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - "--all-targets --no-default-features"
          - "--all-targets --features tokio"
          - "--all-targets --features cli"
          - "--all-targets --features curve"
          - "--all-targets --all-features"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy ${{ matrix.args }} -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run default tests
        run: cargo test

      - name: Run full feature tests
        run: cargo test --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyzmq==27.2.0
      - run: python -c "import zmq; print('pyzmq', zmq.__version__, 'libzmq', zmq.zmq_version())"
      - run: cargo test --features tokio --test libzmq -- --ignored
      - run: cargo run --features tokio --example pub_sub
      - run: cargo run --features tokio --example req_rep
      - run: cargo run --features tokio --example push_pull
      - run: cargo run --features tokio,curve --example curve
