name: Feature request
description: Suggest a change or addition to Celerity.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or API you would like, and any alternatives you considered.
    validations:
      required: true
